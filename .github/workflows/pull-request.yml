name: 'Run tests 🧪'

on:
  pull_request:

  merge_group:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  bundlewatch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - uses: myparcelnl/actions/nx-run-many@v6
        env:
          NX_BRANCH: production
        with:
          target: 'build'

      - uses: myparcelnl/actions/setup-git-credentials@v6
        id: credentials
        with:
          app-id: ${{ secrets.MYPARCEL_APP_ID }}
          private-key: ${{ secrets.MYPARCEL_APP_PRIVATE_KEY }}

      - name: 'Fetch base branch'
        shell: bash
        run: git fetch --no-tags --prune --depth=1 origin ${{ github.base_ref }}

      - uses: myparcelnl/actions/bundlewatch@v6
        with:
          token: ${{ inputs.bundlewatch-token }}
