name: 'Verify npm trusted publishing'

on:
  workflow_dispatch:

concurrency:
  group: int-2236-oidc-pilot
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/feat/int-2236-oidc-pilot'
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Prepare beta versions for all release groups
        run: |
          pnpm nx release version prerelease --preid beta-oidc \
            --git-commit=false --git-tag=false --git-push=false --stage-changes=false

      - uses: myparcelnl/actions/nx-run-many@v6
        env:
          NX_BRANCH: production
        with:
          target: 'build'

      - name: Publish the OIDC beta versions
        run: pnpm -r publish --no-git-checks --tag beta-oidc
