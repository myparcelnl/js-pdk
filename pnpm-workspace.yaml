allowBuilds:
  '@fortawesome/fontawesome-free': false
  '@parcel/watcher': false
  esbuild: false
  nx: false
  vue-demi: false

autoDedupe: true

lockfile:
  includeResolutionSettings: true

# Same patterns as the cooldown exclude in .github/dependabot.yml, so a new release of our own packages installs at once.
minimumReleaseAgeExclude:
  - '@myparcel/*'
  - '@myparcel-dev/*'
  - '@myparcel-eslint/*'
  - '@myparcel-pdk/*'

overrides:
  eslint-plugin-prettier: ^4.2.1
  vue: 3.4.31

packages:
  - 'apps/*'
  - 'libs/**'
